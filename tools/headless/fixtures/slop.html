<!doctype html><html><head><style>
body{font-family:Inter,system-ui,sans-serif;margin:0}
.hero{background:linear-gradient(135deg,#7c3aed,#a78bfa);padding:80px}
.hero h1 span{background:linear-gradient(90deg,hsl(260,80%,60%),#8b5cf6);-webkit-background-clip:text;background-clip:text;color:transparent}
.badge{border-radius:999px;background:#ede9fe;padding:4px 12px;display:inline-block;font-size:12px}
.eyebrow{text-transform:uppercase;letter-spacing:2px;font-size:11px}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;padding:64px}
.card{border-radius:16px;box-shadow:0 1px 4px rgba(0,0,0,.1);padding:24px;min-height:120px}
.step{width:32px;height:32px;border-radius:50%;background:#7c3aed;color:#fff;display:inline-flex;align-items:center;justify-content:center}
section{padding-top:64px;padding-bottom:64px;min-height:220px}
</style></head><body>
<div class="hero"><div class="badge">✨ New</div><h1>Ship <span>faster</span></h1></div>
<section class="grid">
<div class="card"><svg width="24" height="24"></svg><h3>Fast</h3><p>desc</p></div>
<div class="card"><svg width="24" height="24"></svg><h3>Safe</h3><p>desc</p></div>
<div class="card"><svg width="24" height="24"></svg><h3>Easy</h3><p>desc</p></div>
</section>
<section><span class="eyebrow">features</span><span class="eyebrow">pricing</span><span class="eyebrow">docs</span>
<div><span class="step">1</span><span class="step">2</span><span class="step">3</span></div></section>
<section><h2>📊 Stats</h2><h3>🚀 Growth</h3></section>
<section class="grid"><div class="card">a</div><div class="card">b</div><div class="card">c</div></section>
</body></html>
